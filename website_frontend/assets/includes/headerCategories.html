    <!-- ==================== category Header Start Here ==================== -->
    <header class="header bg-white border-bottom border-gray-100">

            <nav class="header-inner d-flex justify-content-between gap-8">

                            class="responsive-dropdown on-hover-dropdown common-dropdown nav-submenu p-0 submenus-submenu-wrapper">
                            <button type="button"
                                class="close-responsive-dropdown rounded-circle text-xl position-absolute inset-inline-end-0 inset-block-start-0 mt-4 me-8 d-lg-none d-flex">
                                <i class="ph ph-x"></i>
                            </button>

                                <!-- Categories will be loaded dynamically here -->
                            </ul>
                        </div>
                    </div>
                    <!-- Category Dropdown End  -->

                    <!-- Menu Start  -->
                    <div class="header-menu d-lg-block d-none">
                        <!-- Nav Menu Start -->

                            <!-- Main menu items will be loaded dynamically here -->

    <!-- ==================== category Header End Here ==================== -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Fetch categories from your API
            fetchCategories();
        });

        async function fetchCategories() {
            try {
                const response = await fetch(`${API_CUSTOMER_URL}/api/product-categories`);
                if (!response.ok) {
                    throw new Error('Failed to fetch categories');
                }

                const data = await response.json();
                const categories = data.categories || [];

                // Organize categories by parent-child relationship
                const categoryMap = organizeCategories(categories);

                // Render the dropdown menu
                renderCategoryDropdown(categoryMap);

                // Render the main menu
                renderMainMenu(categoryMap);

            } catch (error) {
                console.error('Error loading categories:', error);
                // You might want to show a user-friendly error message here
            }
        }

        function organizeCategories(categories) {
            const categoryMap = {
                parentCategories: [],
                childCategories: {}
            };

            // First pass: identify all parent categories
            categories.forEach(category => {
                if (!category.parent_category) {
                    categoryMap.parentCategories.push(category);
                    categoryMap.childCategories[category.id] = [];
                }
            });

            // Second pass: assign child categories to their parents
            categories.forEach(category => {
                if (category.parent_category) {
                    const parentId = category.parent_category;
                    if (categoryMap.childCategories[parentId]) {
                        categoryMap.childCategories[parentId].push(category);
                    } else {
                        // Handle case where parent category might not exist
                        console.warn(`Parent category ${parentId} not found for child ${category.id}`);
                    }
                }
            });

            return categoryMap;
        }

        function renderCategoryDropdown(categoryMap) {
            const dropdownContainer = document.getElementById('categoryDropdown');
            dropdownContainer.innerHTML = '';

            categoryMap.parentCategories.forEach(parentCategory => {
                const hasChildren = categoryMap.childCategories[parentCategory.id]?.length > 0;

                const listItem = document.createElement('li');
                listItem.className = hasChildren ? 'has-submenus-submenu' : '';

                listItem.innerHTML = `
            <a href="shop.html?category=${encodeURIComponent(parentCategory.name)}" 
               class="text-gray-500 text-15 py-12 px-16 flex-align gap-8 rounded-0">
                <span class="text-xl d-flex"><i class="ph ph-brandy"></i></span>
                <span>${parentCategory.name}</span>
                ${hasChildren ? '<span class="icon text-md d-flex ms-auto"><i class="ph ph-caret-right"></i></span>' : ''}
            </a>
        `;

                if (hasChildren) {
                    const submenu = document.createElement('div');
                    submenu.className = 'submenus-submenu py-16';

                    const title = document.createElement('h6');
                    title.className = 'text-lg px-16 submenus-submenu__title';
                    title.textContent = parentCategory.name;

                    const submenuList = document.createElement('ul');
                    submenuList.className = 'submenus-submenu__list max-h-300 overflow-y-auto scroll-sm';

                    categoryMap.childCategories[parentCategory.id].forEach(childCategory => {
                        const childItem = document.createElement('li');
                        childItem.innerHTML = `<a href="shop.html?category=${encodeURIComponent(childCategory.name)}">${childCategory.name}</a>`;
                        submenuList.appendChild(childItem);
                    });

                    submenu.appendChild(title);
                    submenu.appendChild(submenuList);
                    listItem.appendChild(submenu);
                }

                dropdownContainer.appendChild(listItem);
            });
        }

        function renderMainMenu(categoryMap) {
            const menuContainer = document.getElementById('mainMenu');
            menuContainer.innerHTML = '';

            categoryMap.parentCategories.forEach(parentCategory => {
                const hasChildren = categoryMap.childCategories[parentCategory.id]?.length > 0;

                const menuItem = document.createElement('li');
                menuItem.className = `on-hover-item nav-menu__item ${hasChildren ? 'has-submenu' : ''}`;

                menuItem.innerHTML = `
            <a href="${hasChildren ? 'javascript:void(0)' : `shop.html?category=${encodeURIComponent(parentCategory.name)}`}" 
               class="nav-menu__link">${parentCategory.name}</a>
        `;

                if (hasChildren) {
                    const submenu = document.createElement('ul');
                    submenu.className = 'on-hover-dropdown common-dropdown nav-submenu scroll-sm';

                    categoryMap.childCategories[parentCategory.id].forEach(childCategory => {
                        const submenuItem = document.createElement('li');
                        submenuItem.className = 'common-dropdown__item nav-submenu__item';
                        submenuItem.innerHTML = `
                    <a href="shop.html?category=${encodeURIComponent(childCategory.name)}" 
                       class="common-dropdown__link nav-submenu__link hover-bg-neutral-100">
                        ${childCategory.name}
                    </a>
                `;
                        submenu.appendChild(submenuItem);
                    });

                    menuItem.appendChild(submenu);
                }

                menuContainer.appendChild(menuItem);
            });
        }
    </script>
