<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
        }

        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .header {
            text-align: center;
            padding: 20px 0;
        }

        .header h1 {
            font-size: 24px;
            color: #333;
        }

        .header p {
            color: #555;
        }

        .order-details {
            margin-bottom: 30px;
        }

        .order-details table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .order-details th, .order-details td {
            padding: 10px;
            text-align: left;
        }

        .order-details th {
            background-color: #f1f1f1;
        }

        .order-details td {
            background-color: #fafafa;
        }

        .total-row {
            font-weight: bold;
            background-color: #f1f1f1;
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        .buttons button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .buttons .back {
            background-color: #e0e0e0;
            color: #333;
        }

        .buttons .track {
            background-color: #28a745;
            color: white;
        }

        .customer-details {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            padding-top: 20px;
        }

        .customer-details .address {
            width: 45%;
            padding: 15px;
            background-color: #f1f1f1;
            border-radius: 8px;
        }

        .customer-details h3 {
            margin-top: 0;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                width: 90%;
            }

            .customer-details {
                flex-direction: column;
                align-items: center;
            }

            .customer-details .address {
                width: 100%;
                margin-bottom: 20px;
            }

            .buttons button {
                width: 100%;
                margin-top: 10px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header p {
                font-size: 14px;
            }

            .order-details table th, .order-details table td {
                padding: 8px;
            }

            .total-row td {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 18px;
            }

            .header p {
                font-size: 12px;
            }

            .buttons button {
                font-size: 14px;
                padding: 12px;
            }

            .order-details table th, .order-details table td {
                font-size: 12px;
                padding: 6px;
            }

            .total-row td {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header">
            <h1>Order #<span id="orderId"></span></h1>
            <p>Hi <span id="customerName"></span>, Thank you for your purchase.</p>
            <p>Order Date: <span id="orderDate"></span></p>
            <p>Payment Method: <span id="paymentMethod"></span></p>
        </div>

        <div class="order-details">
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Tax</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="orderDetailsTable">
                    <!-- Product rows will be inserted here dynamically -->
                </tbody>
                <tfoot>
                    <tr class="total-row">
                        <td colspan="4" style="text-align: right;">Subtotal</td>
                        <td id="subtotal"></td>
                    </tr>
                    <tr class="total-row">
                        <td colspan="4" style="text-align: right;">Shipping</td>
                        <td id="shipping"></td>
                    </tr>
                    <tr class="total-row">
                        <td colspan="4" style="text-align: right;">Total</td>
                        <td id="total"></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="buttons">
            <button class="back">Back To Store</button>
            <button class="track">Track Your Order</button>
        </div>

        <div class="customer-details">
            <div class="address">
                <h3>Billing Address</h3>
                <p id="billingAddress"></p>
            </div>
            <div class="address">
                <h3>Shipping Address</h3>
                <p id="shippingAddress"></p>
            </div>
        </div>
    </div>

    <script>
        // Fetch URL parameters to dynamically load order data
        const urlParams = new URLSearchParams(window.location.search);

        // Order data populated from URL parameters
        document.getElementById('orderId').textContent = urlParams.get('order_id') || '';
        document.getElementById('customerName').textContent = urlParams.get('customer_name') || '';
        document.getElementById('orderDate').textContent = urlParams.get('order_date') || '';
        document.getElementById('paymentMethod').textContent = urlParams.get('payment_method') || '';

        // Order details table dynamic insertion
        let orderDetailsHTML = '';
        const products = JSON.parse(urlParams.get('order_details') || '[]'); // Expecting a JSON array string
        products.forEach(item => {
            orderDetailsHTML += `
                <tr>
                    <td>${item.product}</td>
                    <td>${item.quantity}</td>
                    <td>${item.price}</td>
                    <td>${item.tax}</td>
                    <td>${item.total}</td>
                </tr>
            `;
        });
        document.getElementById('orderDetailsTable').innerHTML = orderDetailsHTML;

        // Populate other total fields
        document.getElementById('subtotal').textContent = urlParams.get('subtotal') || '';
        document.getElementById('shipping').textContent = urlParams.get('shipping') || '';
        document.getElementById('total').textContent = urlParams.get('total') || '';

        // Customer addresses
        document.getElementById('billingAddress').innerHTML = urlParams.get('billing_address') || '';
        document.getElementById('shippingAddress').innerHTML = urlParams.get('shipping_address') || '';
    </script>

</body>

</html>
