
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>
    <style>
            body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
        }

        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .header {
            text-align: center;
            padding: 20px 0;
        }

        .header h1 {
            font-size: 24px;
            color: #333;
        }

        .header p {
            color: #555;
        }

        .order-details {
            margin-bottom: 30px;
        }

        .order-details table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .order-details th, .order-details td {
            padding: 10px;
            text-align: left;
        }

        .order-details th {
            background-color: #f1f1f1;
        }

        .order-details td {
            background-color: #fafafa;
        }

        .total-row {
            font-weight: bold;
            background-color: #f1f1f1;
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        .buttons button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .buttons .back {
            background-color: #e0e0e0;
            color: #333;
        }

        .buttons .track {
            background-color: hsl(76.46deg 65.08% 49.41%);
            color: white;
        }

        .customer-details {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            padding-top: 20px;
        }

        .customer-details .address {
            width: 45%;
            padding: 15px;
            background-color: #f1f1f1;
            border-radius: 8px;
        }

        .customer-details h3 {
            margin-top: 0;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                width: 90%;
            }

            .customer-details {
                flex-direction: column;
                align-items: center;
            }

            .customer-details .address {
                width: 100%;
                margin-bottom: 20px;
            }

            .buttons button {
                width: 100%;
                margin-top: 10px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header p {
                font-size: 14px;
            }

            .order-details table th, .order-details table td {
                padding: 8px;
            }

            .total-row td {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 18px;
            }

            .header p {
                font-size: 12px;
            }

            .buttons button {
                font-size: 14px;
                padding: 12px;
            }

            .order-details table th, .order-details table td {
                font-size: 12px;
                padding: 6px;
            }

            .total-row td {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Order #<span id="orderId"></span></h1>
            <p>Hi <span id="customerName"></span>, Thank you for your purchase.</p>
            <p>Order Date: <span id="orderDate"></span></p>
            <p>Payment Method: <span id="paymentMethod"></span></p>
            <p>Order Status: <span id="orderStatus"></span></p>
        </div>

        <div class="order-details">
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="orderDetailsTable">
                    <!-- Product rows will be inserted here dynamically -->
                </tbody>
                <tfoot>
                    <tr class="total-row">
                        <td colspan="3" style="text-align: right;">Total Amount</td>
                        <td id="totalAmount"></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="buttons">
            <button class="back">Back To Store</button>
            <a href="https://graba2z.netlify.app/track-order">
                <button class="track">Track Your Order</button>
            </a>
        </div>

        <div class="customer-details">
            <div class="address">
                <h3>Customer Details</h3>
                <p id="customerEmail"></p>
                <p id="customerPhone"></p>
            </div>
            <div class="address">
                <h3>Shipping Address</h3>
                <p id="shippingAddress"></p>
            </div>
        </div>
    </div>

    <script>
        // Get order ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id');
        
        if (!orderId) {
            alert('Order ID not found in URL');
            window.location.href = '/'; // Redirect to home if no order ID
        }

        // Fetch order details from API
        async function fetchOrderDetails(orderId) {
            try {
                const response = await fetch(`https://grabatoz-production.uprailway.app/api/orderfetchbyidonreciept/${orderId}`);
                if (!response.ok) {
                    throw new Error('Failed to fetch order details');
                }
                const order = await response.json();
                populateOrderDetails(order);
            } catch (error) {
                console.error('Error fetching order:', error);
                alert('Failed to load order details. Please try again later.');
            }
        }

        // Populate the page with order data
        function populateOrderDetails(order) {
            // Basic order info
            document.getElementById('orderId').textContent = order.order_id;
            document.getElementById('customerName').textContent = order.customer_name || 'Customer';
            document.getElementById('orderDate').textContent = new Date(order.created_at).toLocaleDateString();
            document.getElementById('paymentMethod').textContent = order.payment_type;
            document.getElementById('orderStatus').textContent = order.order_status;
            document.getElementById('totalAmount').textContent = `$${order.total_amount}`;

            // Parse and display card info if available
            try {
                const cardInfo = JSON.parse(order.card_info);
                let productHTML = '';
                if (Array.isArray(cardInfo)) {
                    cardInfo.forEach(item => {
                        productHTML += `
                            <tr>
                                <td>${item.V1v1 || 'Product'}</td>
                                <td>${item.quantity || 1}</td>
                                <td>$${item.V1sailing_pric || '0.00'}</td>
                                <td>$${item.V1sailing_pric ? (item.V1sailing_pric * (item.quantity || 1)).toFixed(2) : '0.00'}</td>
                            </tr>
                        `;
                    });
                }
                document.getElementById('orderDetailsTable').innerHTML = productHTML;
            } catch (e) {
                console.error('Error parsing card info:', e);
                document.getElementById('orderDetailsTable').innerHTML = `
                    <tr>
                        <td colspan="4">Product information not available</td>
                    </tr>
                `;
            }

            // Customer contact info from shippingInfo
            try {
                const shippingInfo = JSON.parse(order.shippingInfo.replace(/\\"/g, '"'));
                document.getElementById('customerEmail').textContent = shippingInfo.email || '';
                document.getElementById('customerPhone').textContent = shippingInfo.contact || '';
            } catch (e) {
                console.error('Error parsing shipping info:', e);
                document.getElementById('customerEmail').textContent = 'Email not available';
                document.getElementById('customerPhone').textContent = 'Phone not available';
            }

            // Shipping address
            document.getElementById('shippingAddress').textContent = order.shipping_address;

            // Back button functionality
            document.querySelector('.back').addEventListener('click', () => {
                window.location.href = 'https://graba2z.netlify.app';
            });
        }

        // Initialize the page
        fetchOrderDetails(orderId);
    </script>
</body>
</html>
