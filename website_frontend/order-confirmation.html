
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmation</title>
    <style>
            body {
            font-family: Arial, sans-serif;
            margin: 0;  
            padding: 0;
            background-color: #f7f7f7;
        }

        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        .header {
            text-align: center;
            padding: 20px 0;
        }

        .header h1 {
            font-size: 24px;
            color: #333;
        }

        .header p {
            color: #555;
        }

        .order-details {
            margin-bottom: 30px;
        }

        .order-details table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .order-details th, .order-details td {
            padding: 10px;
            text-align: left;
        }

        .order-details th {
            background-color: #f1f1f1;
        }

        .order-details td {
            background-color: #fafafa;
        }

        .total-row {
            font-weight: bold;
            background-color: #f1f1f1;
        }

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        .buttons button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .buttons .back {
            background-color: #e0e0e0;
            color: #333;
        }

        .buttons .track {
            background-color: hsl(76.46deg 65.08% 49.41%);
            color: white;
        }

        .customer-details {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            padding-top: 20px;
        }

        .customer-details .address {
            width: 45%;
            padding: 15px;
            background-color: #f1f1f1;
            border-radius: 8px;
        }

        .customer-details h3 {
            margin-top: 0;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                width: 90%;
            }

            .customer-details {
                flex-direction: column;
                align-items: center;
            }

            .customer-details .address {
                width: 100%;
                margin-bottom: 20px;
            }

            .buttons button {
                width: 100%;
                margin-top: 10px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header p {
                font-size: 14px;
            }

            .order-details table th, .order-details table td {
                padding: 8px;
            }

            .total-row td {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 18px;
            }

            .header p {
                font-size: 12px;
            }

            .buttons button {
                font-size: 14px;
                padding: 12px;
            }

            .order-details table th, .order-details table td {
                font-size: 12px;
                padding: 6px;
            }

            .total-row td {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Order #<span id="orderId"></span></h1>
            <p>Hi <span id="customerName"></span>, Thank you for your purchase.</p>
            <p>Order Date: <span id="orderDate"></span></p>
            <p>Payment Method: <span id="paymentMethod"></span></p>
            <p>Order Status: <span id="orderStatus"></span></p>
        </div>

        <div class="order-details">
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>Price</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="orderDetailsTable">
                    <!-- Product rows will be inserted here dynamically -->
                </tbody>
                <tfoot>
                    <tr class="total-row">
                        <td colspan="3" style="text-align: right;">Total Amount</td>
                        <td id="totalAmount"></td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="buttons">
            <button class="back">Back To Store</button>
            <a href="https://graba2z.netlify.app/track-order">
                <button class="track">Track Your Order</button>
            </a>
        </div>

        <div class="customer-details">
            <div class="address">
                <h3>Customer Details</h3>
                <p id="customerEmail"></p>
                <p id="customerPhone"></p>
            </div>
            <div class="address">
                <h3>Shipping Address</h3>
                <p id="shippingAddress"></p>
            </div>
        </div>
    </div>
 <script>
        // Get order ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id');
        
        if (!orderId) {
            alert('Order ID not found in URL');
            window.location.href = '/';
        }

        // Fetch order details from API
        async function fetchOrderDetails(orderId) {
            try {
                console.log(`Fetching order ${orderId}...`);
                const apiUrl = `https://grabatoz-production.up.railway.app/api/orderfetchbyidonreciept/${orderId}`;
                console.log('API URL:', apiUrl);
                
                const response = await fetch(apiUrl, {
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                console.log('Response status:', response.status);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const order = await response.json();
                console.log('Order data:', order);
                populateOrderDetails(order);
            } catch (error) {
                console.error('Error fetching order:', error);
                alert(`Failed to load order details: ${error.message}`);
            }
        }

       // Replace your current populateOrderDetails function with this version
function populateOrderDetails(order) {
    // Basic order info
    document.getElementById('orderId').textContent = order.order_id;
    document.getElementById('customerName').textContent = order.customer_name || 'Customer';
    document.getElementById('orderDate').textContent = formatDate(order.created_at);
    document.getElementById('paymentMethod').textContent = order.payment_type;
    document.getElementById('orderStatus').textContent = order.order_status;
    document.getElementById('totalAmount').textContent = `AED ${order.total_amount}`;

    // Parse and display card info
    try {
        // First, properly parse the JSON string
        const cardInfo = JSON.parse(order.card_info);
        let productHTML = '';
        
        if (Array.isArray(cardInfo)) {
            cardInfo.forEach(item => {
                const productName = item.name || 'Product';
                const price = item.offer_price || item.selling_price || '0.00';
                const quantity = item.quantity || 1;
                const total = (parseFloat(price) * quantity).toFixed(2);
                
                productHTML += `
                    <tr>
                        <td>${productName}</td>
                        <td>${quantity}</td>
                        <td>AED ${price}</td>
                        <td>AED ${total}</td>
                    </tr>
                `;
            });
            document.getElementById('orderDetailsTable').innerHTML = productHTML;
        } else {
            throw new Error('Card info is not an array');
        }
    } catch (e) {
        console.error('Error parsing card info:', e);
        console.log('Original card_info:', order.card_info);
        document.getElementById('orderDetailsTable').innerHTML = `
            <tr>
                <td colspan="4">Product information not available</td>
            </tr>
        `;
    }

    // Rest of your function remains the same...
    // Customer contact info from shippingInfo
    try {
        const fixedShippingInfo = order.shippingInfo
            .replace(/\\"/g, '"')
            .replace(/"\s*([{\[])/g, '$1')
            .replace(/([}\]])"\s*/g, '$1');
            
        const shippingInfo = JSON.parse(fixedShippingInfo);
        document.getElementById('customerEmail').textContent = shippingInfo.email || '';
        document.getElementById('customerPhone').textContent = shippingInfo.contact || '';
    } catch (e) {
        console.error('Error parsing shipping info:', e);
        document.getElementById('customerEmail').textContent = 'Email not available';
        document.getElementById('customerPhone').textContent = 'Phone not available';
    }

    // Shipping address
    document.getElementById('shippingAddress').textContent = order.shipping_address;

    // Back button functionality
    document.querySelector('.back').addEventListener('click', () => {
        window.location.href = 'https://graba2z.netlify.app';
    });
}
        // Helper function to format date
        function formatDate(dateString) {
            try {
                // Handle malformed date strings like "028:56-23T16:05159.8082"
                const fixedDateString = dateString.replace(/(\d{2}):(\d{2})-(\d{2})T/, '$3-$2-$1T');
                const date = new Date(fixedDateString);
                return date.toLocaleDateString();
            } catch (e) {
                console.error('Error formatting date:', e);
                return dateString; // Return original if we can't parse it
            }
        }

        // Initialize the page
        fetchOrderDetails(orderId);
    </script>
</body>
</html>
