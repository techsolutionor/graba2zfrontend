<!-- lightbox-popup.html -->
<template id="lightbox-template">
  <div class="lightbox" id="lightbox" style="display: flex !important;">
    <div class="lightbox-controls">
      <button onclick="zoomIn()" title="Zoom In"><i class="fas fa-magnifying-glass-plus"></i></button>
      <button onclick="zoomOut()" title="Zoom Out"><i class="fas fa-magnifying-glass-minus"></i></button>
      <button onclick="toggleFullscreen()" title="Fullscreen"><i class="fas fa-expand"></i></button>
      <button onclick="closeLightbox()" title="Close"><i class="fas fa-times"></i></button>
    </div>

    <div class="nav-controls">
      <button onclick="prevImage()">‹</button>
      <button onclick="nextImage()">›</button>
    </div>

    <div class="lightbox-content">
      <div class="thumbs-vertical" id="lightbox-thumbs"></div>
      <img class="lightbox-img" id="lightbox-img" src="" alt="Preview">
    </div>
  </div>
</template>

<script>
  let lightboxImg, lightbox, thumbsContainer;
  let imageUrls = [];
  let currentIndex = 0;
  let zoomLevel = 1;

  function fetchProductImages(slug) {
    const API_URL = 'https://websitegrabatoz-production.up.railway.app/api/products/slug/' + slug;

    fetch(API_URL)
      .then(res => res.json())
      .then(product => {
        let paths = product.image_paths;
        if (typeof paths === 'string') {
          try {
            paths = JSON.parse(paths);
          } catch {
            paths = [];
          }
        }

        const baseUrl = 'https://grabatoz-production.up.railway.app';
        imageUrls = paths.map(p => `${baseUrl}/${p.replace(/\\/g, '/')}`);
        openLightbox(0);
      })
      .catch(err => {
        console.error('Error loading product images in lightbox:', err);
      });
  }

  function openLightbox(index) {
    currentIndex = index;
    zoomLevel = 1;
    lightbox.style.display = 'flex';
    updateImage();
  }

  function updateImage() {
    lightboxImg.src = imageUrls[currentIndex];
    lightboxImg.style.transform = `scale(${zoomLevel})`;
    renderThumbnails();
  }

  function renderThumbnails() {
    thumbsContainer.innerHTML = '';
    imageUrls.forEach((url, index) => {
      const img = document.createElement('img');
      img.src = url;
      if (index === currentIndex) img.classList.add('active');
      img.onclick = () => {
        currentIndex = index;
        updateImage();
      };
      thumbsContainer.appendChild(img);
    });
  }

  function closeLightbox() {
    lightbox.style.display = 'none';
    document.exitFullscreen?.();
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % imageUrls.length;
    updateImage();
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + imageUrls.length) % imageUrls.length;
    updateImage();
  }

  function zoomIn() {
    zoomLevel = Math.min(3, zoomLevel + 0.2);
    lightboxImg.style.transform = `scale(${zoomLevel})`;
  }

  function zoomOut() {
    zoomLevel = Math.max(0.5, zoomLevel - 0.2);
    lightboxImg.style.transform = `scale(${zoomLevel})`;
  }

  function toggleFullscreen() {
    const elem = document.documentElement;
    if (!document.fullscreenElement) {
      elem.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
  }

  // This must be triggered after template is injected
  function initializeLightbox() {
    lightboxImg = document.getElementById('lightbox-img');
    lightbox = document.getElementById('lightbox');
    thumbsContainer = document.getElementById('lightbox-thumbs');

    const slug = localStorage.getItem('grz_slug');
    if (slug) fetchProductImages(slug);
  }
</script>
