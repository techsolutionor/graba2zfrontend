<!-- lightbox-popup.html -->
<template id="lightbox-template">
  <div class="lightbox" id="lightbox" style="display: flex !important;">
    <div class="lightbox-controls">
      <button onclick="zoomIn()" title="Zoom In">+</button>
      <button onclick="zoomOut()" title="Zoom Out">-</button>
      <button onclick="toggleFullscreen()" title="Fullscreen">[ ]</button>
      <button onclick="closeLightbox()" title="Close">x</button>
    </div>

    <div class="nav-controls">
      <button onclick="prevImage()">‹</button>
      <button onclick="nextImage()">›</button>
    </div>

    <div class="lightbox-content">
      <div class="thumbs-vertical" id="lightbox-thumbs"></div>
      <img class="lightbox-img" id="lightbox-img" src="" alt="Preview">
    </div>
  </div>
</template>
