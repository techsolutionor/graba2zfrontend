    <script>
        // Function to get the topic slug from the URL query parameter
        function getTopicSlugFromQuery() {
            const params = new URLSearchParams(window.location.search);
            return params.get('slug');
        }

        // Function to format date
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }

        // Function to load topic data
        async function loadTopicData() {
            const slug = getTopicSlugFromQuery();
            if (!slug) {
                document.getElementById('topic-title').textContent = 'Invalid Topic';
                return;
            }

            try {
                // Fetch topic details
                const topicResponse = await fetch(`https://grabatoz-production.up.railway.app/api/blog-topics/slug/${slug}`);
                if (!topicResponse.ok) throw new Error('Failed to fetch topic');
                const topic = await topicResponse.json();
                document.getElementById('topic-title').textContent = topic.topic_name || 'Topic';

                // Fetch blogs for the topic
                const blogsResponse = await fetch(`https://grabatoz-production.up.railway.app/api/blog`);
                if (!blogsResponse.ok) throw new Error('Failed to fetch blogs');
                const blogs = await blogsResponse.json();

                // Filter blogs by topic_id
                const topicBlogs = blogs.filter(blog => blog.topic_id === topic.id && blog.status === 'Live');
                displayTopicBlogs(topicBlogs);
            } catch (error) {
                console.error('Error loading topic data:', error);
                document.getElementById('topic-title').textContent = 'Error loading topic';
                document.getElementById('topic-blogs').innerHTML = '<p>Unable to load blogs for this topic.</p>';
            }
        }

        // Function to display blogs for the topic
        function displayTopicBlogs(blogs) {
            const blogGrid = document.getElementById('topic-blogs');
            if (blogs.length > 0) {
                blogGrid.innerHTML = blogs.map(blog => `
                    <div class="blog-card">
                        <a href="https://graba2z.netlify.app/single-post/?slug=${blog.slug}">
                            <img src="${blog.main_image ? `https://grabatoz-production.up.railway.app/${blog.main_image}` : 'https://graba2z.netlify.app/assets/images/logo/logo1.svg'}" alt="${blog.blog_name}">
                            <div class="blog-card-content">
                                <div class="purple-text">${blog.main_category_name || 'Tech & Laptops'}</div>
                                <h3 class="blog-card-title">${blog.blog_name}</h3>
                                <div class="blog-card-meta">
                                    <span>${formatDate(blog.created_at)}</span>
                                    <span class="separator">|</span>
                                    <span>${blog.read_minutes || 8} minute read</span>
                                </div>
                            </div>
                        </a>
                    </div>
                `).join('');
            } else {
                blogGrid.innerHTML = '<p>No blogs available for this topic.</p>';
            }
        }

async function loadBlogTopics() {
    try {
        const response = await fetch('https://grabatoz-production.up.railway.app/api/blog-topics');
        if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
        }
        const topics = await response.json();
        displayBlogTopics(topics);
    } catch (error) {
        console.error('Error loading blog topics:', error);
        displayBlogTopics([]); // Show empty state on error
    }
}

function displayBlogTopics(topics) {
    const topicsContainer = document.getElementById('blog-topics');
    if (topics && topics.length > 0) {
        topicsContainer.innerHTML = topics
            .map(topic => `
                <li class="topic-item" style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
                    ${topic.image ? 
                        `<img src="https://grabatoz-production.up.railway.app/${topic.image}" alt="${topic.topic_name}" style="width: 30px; height: 30px; object-fit: cover; border-radius: 4px;" onerror="this.src='https://graba2z.netlify.app/assets/images/logo/logo1.svg';">` : 
                        `<span style="width: 30px; height: 30px; background-color: #e0e0e0; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #666;">${topic.topic_name.charAt(0)}</span>`
                    }
                    <a href="https://graba2z.netlify.app/blog-topics/?slug=${topic.slug}" style="text-decoration: none; color: #333; font-size: 14px; line-height: 1.4;">
                        ${topic.topic_name}
                    </a>
                </li>
            `)
            .join('');
    } else {
        topicsContainer.innerHTML = '<li style="font-size: 14px; color: #666;">No topics available at the moment.</li>';
    }
}
      
        // Function to load recent posts for sidebar
        async function loadRecentPosts() {
            try {
                const response = await fetch('https://grabatoz-production.up.railway.app/api/blog');
                if (!response.ok) throw new Error('Failed to fetch recent posts');
                const blogs = await response.json();
                displayRecentPosts(blogs);
            } catch (error) {
                console.error('Error loading recent posts:', error);
            }
        }

        // Function to display recent posts in sidebar
        function displayRecentPosts(blogs) {
            const recentPostsList = document.getElementById('recent-posts-list');
            const recentBlogs = blogs
                .filter(blog => blog.status === 'Live')
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
                .slice(0, 5);

            if (recentBlogs.length > 0) {
                recentPostsList.innerHTML = recentBlogs.map(blog => `
                    <li style="margin-bottom: 10px;">
                        <a href="https://graba2z.netlify.app/single-post/?slug=${blog.slug}" style="text-decoration: none; color: #333; font-size: 14px; line-height: 1.4;">
                            ${blog.blog_name}
                        </a>
                    </li>
                `).join('');
            } else {
                recentPostsList.innerHTML = '<li>No recent posts available</li>';
            }
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            loadTopicData();
            loadBlogTopics();
            loadRecentPosts();
        });
